plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cursor_crosshair" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	bundledResourceLoader
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	bundledResourceLoader(fabricApi.module("fabric-resource-loader-v1", project.fabric_api_version)) {
		transitive = false
	}
	bundledResourceLoader(fabricApi.module("fabric-api-base", project.fabric_api_version)) {
		transitive = false
	}

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	from(configurations.bundledResourceLoader) {
		into "META-INF/jars"
		rename { fileName ->
			fileName.startsWith("fabric-resource-loader-v1-")
					? "fabric-resource-loader-v1.jar"
					: "fabric-api-base.jar"
		}
	}
}
